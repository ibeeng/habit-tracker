// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Some capacitor plugins still ship a `package` in their manifest instead of a
    // gradle `namespace`, which AGP 8 rejects. Fill it in from the manifest package.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null && androidExt.namespace == null) {
                def manifest = new File(project.projectDir, 'src/main/AndroidManifest.xml')
                if (manifest.exists()) {
                    def parsed = new groovy.xml.XmlSlurper().parse(manifest)
                    def pkg = parsed.@package.text()
                    if (pkg) {
                        androidExt.namespace = pkg
                    }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
