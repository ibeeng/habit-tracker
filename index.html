    <style>
      /* static first-paint shell — no JS needed, replaced when React mounts */
      html {
        background: #0a0f0a;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: #0a0f0a;
        color: #33ff66;
        font-family: ui-monospace, 'Cascadia Code', Menlo, monospace;
      }
      #boot .b-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      #boot .b-bar {
        width: 120px;
        height: 6px;
        border: 1px solid #1a2e1f;
        border-radius: 2px;
        overflow: hidden;
      }
      #boot .b-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #33ff66;
        animation: b-slide 1.1s steps(6, end) infinite;
      }
      #boot .b-hint {
        font-size: 11px;
        color: #3d5c48;
      }
      @keyframes b-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .b-bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
